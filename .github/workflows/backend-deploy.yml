name: Deploy Backend to Cloud Run & Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  # GCP Configuration (Configure these in GitHub Secrets or replace placeholders)
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'asia-east1' }} # Default region, e.g., Tokyo or Taiwan
  GCP_SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}
  GAR_REPO_NAME: ${{ secrets.GCP_GAR_REPO_NAME || 'hotel-repo' }} # Google Artifact Registry repository name

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 1. Authenticate with Google Cloud (WIF) ----
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ---- 2. Build and Push Container to Artifact Registry ----
      - name: Configure Docker Client
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO_NAME }}/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}"
          
          # Build from the backend directory using its Dockerfile
          docker build -t $IMAGE_TAG ./backend
          docker push $IMAGE_TAG
          
          # Output the image tag for the next step
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # ---- 3. Deploy to Cloud Run ----
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.GCP_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_TAG }}
          # You can specify env variables for the container here or configure them in Cloud Run console
          # env_vars: |
          #   APP_ENV=production
          #   DATABASE_URL=${{ secrets.SUPABASE_DB_URL }}

      # ---- 4. Supabase DB Migration (Optional) ----
      - name: Run Supabase Migrations
        run: |
          if [ -d "supabase" ]; then
            echo "Supabase directory detected. Installing Supabase CLI..."
            npm install -g supabase
            
            if [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
              echo "Running database migrations..."
              supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
            else
              echo "WARNING: SUPABASE_DB_URL secret is not set, skipping database push."
            fi
          else
            echo "No supabase directory found. Skipping migrations."
          fi
